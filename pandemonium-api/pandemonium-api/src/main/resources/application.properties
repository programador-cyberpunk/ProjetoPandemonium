spring.application.name=pandemonium-api

server.port=8080

# Configura\uFFFD\uFFFDo do Banco de Dados (que ainda n\uFFFDo t\uFFFDo la)
spring.datasource.url=jdbc:mysql://localhost:3306/banco_pandemonium?useSSl=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Configuration do Hibernate /JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql= true
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
